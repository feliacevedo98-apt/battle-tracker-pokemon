    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Type Badges Styling */
        .type-normal   { background-color: #A8A878; color: #fff; }
        .type-fire     { background-color: #F08030; color: #fff; }
        .type-water    { background-color: #6890F0; color: #fff; }
        .type-grass    { background-color: #78C850; color: #fff; }
        .type-electric { background-color: #F8D030; color: #111; }
        .type-ice      { background-color: #98D8D8; color: #111; }
        .type-fighting { background-color: #C03028; color: #fff; }
        .type-poison   { background-color: #A040A0; color: #fff; }
        .type-ground   { background-color: #E0C068; color: #111; }
        .type-flying   { background-color: #A890F0; color: #fff; }
        .type-psychic  { background-color: #F85888; color: #fff; }
        .type-bug      { background-color: #A8B820; color: #fff; }
        .type-rock     { background-color: #B8A038; color: #fff; }
        .type-ghost    { background-color: #705898; color: #fff; }

        /* Pokéball Logo CSS Animation */
        .pokeball-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(to bottom, #ee1515 0%, #ee1515 46%, #111827 46%, #111827 54%, #ffffff 54%, #ffffff 100%);
            border-radius: 50%;
            border: 3px solid #111827;
            position: relative;
            box-shadow: 0 0 10px rgba(238, 21, 21, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pokeball-logo::after {
            content: '';
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: 3px solid #111827;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.5);

            width: min(340px, calc(100vw - 16px)); max-height: calc(100vh - 16px);

<body class="min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <!-- Logo Pokéball V1 -->
            <div class="flex items-center gap-3">
                <div class="pokeball-logo"></div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                        <span>Battle Tracker</span> <span class="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full font-semibold">BT</span>
                    </h1>
                    <p class="text-xs text-slate-400">Pokémon Champions &amp; PP Counter</p>
                </div>
            </div>

            <!-- Mode Switcher & Controls -->
            <div class="flex items-center gap-3 flex-wrap">
                <!-- Format Selector (Doubles / Singles) for Champions Mode -->
                <div id="formatSelectorContainer" class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex items-center text-xs font-semibold">
                    <span class="text-slate-400 text-[10px] uppercase font-bold px-1.5" data-i18n="format">Formato:</span>
                    <button data-i18n="Doubles" id="btnFormatDoubles" onclick="setChampionsFormat('Doubles')" class="px-2 py-1 rounded bg-red-600 text-white text-xs font-bold transition">
                        Doubles
                    </button>
                    <button data-i18n="Singles" id="btnFormatSingles" onclick="setChampionsFormat('Singles')" class="px-2 py-1 rounded text-slate-400 hover:text-white text-xs font-bold transition">
                        Singles
                    </button>
                </div>

                <label class="flex items-center gap-2 text-xs text-slate-300" for="languageSelector">
                    <span data-i18n="language">Idioma</span>
                    <select id="languageSelector" onchange="setLanguage(this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-white">
                        <option value="en">English (EN)</option>
                        <option value="es-ES">Español - España (ES-ES)</option>
                        <option value="es-LA">Español - Latinoamérica (ES-LA)</option>
                    </select>
                </label>
                <!-- Action Buttons -->
                <button onclick="resetAllSlots()" data-i18n-title="resetTitle" title="Reiniciar los Pokémon visibles" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate-right"></i> <span data-i18n="reset">Reiniciar</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left / Top Status Bar (Rules & Info) -->
        <div class="lg:col-span-12 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row justify-between items-center gap-4 text-sm">
            <div class="flex items-center gap-3">
                <div id="modeBadge" class="px-2.5 py-1 rounded-md bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold uppercase tracking-wider">
                    Modo Champions
                </div>
            </div>
            <div id="loadingStatus" class="hidden flex items-center gap-2 text-xs text-amber-400 bg-amber-950/40 border border-amber-800/50 px-3 py-1 rounded-full">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <span data-i18n="loading" id="loadingMsg">Cargando datos...</span>
            </div>
        </div>

        <!-- Visible slots: 4 Doubles / 3 Singles; hidden state is retained -->
        <div class="lg:col-span-12 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6" id="slotsContainer">
            <!-- Slots will be injected dynamically by JavaScript -->
        </div>
    </main>

         *  UTILIDADES

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function stripAccents(str) {
            return String(str ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        // "Mr. Mime" -> "mrmime", "Nidoran♀" -> "nidoranf", "Flabébé" -> "flabebe"
        function toShowdownId(str) {
            return stripAccents(str)
                .replace(/♀/g, 'f').replace(/♂/g, 'm')
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '');
        }

        // "Will O Wisp" -> "will-o-wisp"
        function slugify(str) {
            return stripAccents(str)
                .replace(/♀/g, '-f').replace(/♂/g, '-m')
                .toLowerCase().trim()
                .replace(/\s+/g, '-')
                .replace(/[^a-z0-9-]/g, '')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function formatName(str) {
            if (!str) return '';
            return String(str).split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function safeCssToken(str) {
            return String(str ?? '').toLowerCase().replace(/[^a-z]/g, '') || 'unknown';
        }

        function formatFormLabel(formName, baseSpeciesName) {
            if (formName === baseSpeciesName) return t('baseForm');
            const clean = formName.startsWith(baseSpeciesName + '-')
                ? formName.slice(baseSpeciesName.length + 1)
                : formName;
            if (clean === 'alola') return 'Alola';
            if (clean === 'galar') return 'Galar';
            if (clean === 'hisui') return 'Hisui';
            if (clean === 'paldea') return 'Paldea';
            if (clean.includes('mega-x')) return 'Mega X';
            if (clean.includes('mega-y')) return 'Mega Y';
            if (clean.includes('mega')) return 'Mega';
            if (clean.includes('gmax')) return userLocale === 'en' ? 'Gigantamax' : 'Gigamax';
            const labels = {
                normal: 'Normal', attack: 'Ataque', defense: 'Defensa', speed: 'Velocidad',
                shield: 'Escudo', blade: 'Filo', therian: 'Tótem', incarnate: 'Avatar',
                origin: 'Origen', altered: 'Modificada', land: 'Tierra', sky: 'Cielo',
                male: 'Macho', female: 'Hembra', sunny: 'Sol', rainy: 'Lluvia', snowy: 'Nieve',
                heat: 'Calor', wash: 'Lavado', frost: 'Frío', fan: 'Ventilador', mow: 'Corte',
                amped: 'Aguda', 'low-key': 'Grave', 'single-strike': 'Brusco',
                'rapid-strike': 'Fluido', hero: 'Heroica', zero: 'Ingenua',
                'paldea-combat-breed': 'Paldea · Combatiente', 'paldea-blaze-breed': 'Paldea · Ardiente',
                'paldea-aqua-breed': 'Paldea · Acuática'
            };
            return userLocale === 'en' ? formatName(clean) : labels[clean] || formatName(clean);
        }

            el.textContent = msg;
            host.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }

        function beginLoading(message) {
            pendingLoads++;
            const el = document.getElementById('loadingStatus');
            const msgEl = document.getElementById('loadingMsg');
            if (el) el.classList.remove('hidden');
            if (msgEl) msgEl.textContent = message || t('loading');
        }

        function endLoading() {
            pendingLoads = Math.max(0, pendingLoads - 1);
            if (pendingLoads === 0) {
                const el = document.getElementById('loadingStatus');
                if (el) el.classList.add('hidden');
            }
        }

        /* =====================================================================
         *  PERSISTENCIA
         * ===================================================================== */
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 4, userLocale, championsFormat, slotsData }));
            } catch (e) {
                console.warn('No se pudo guardar el estado:', e);
                showToast(t('storageError'), 'warn');
            }
        }

        function normalizeSlot(raw, i) {
            const base = emptySlot(i);
            if (!raw || typeof raw !== 'object') return base;
            const str = (v) => (typeof v === 'string' ? v : '');
            const strList = (v) => (Array.isArray(v) ? v.filter(x => typeof x === 'string') : []);

            const slot = {
                ...base,
                id: i + 1,
                selectedPokemon: str(raw.selectedPokemon),
                activeFormName: str(raw.activeFormName),
                formsList: Array.isArray(raw.formsList)
                    ? raw.formsList.filter(f => f && typeof f.name === 'string')
                        .map(f => ({ name: f.name, label: str(f.label) || formatName(f.name), is_default: !!f.is_default }))
                    : [],
                types: strList(raw.types).length ? strList(raw.types) : ['unknown'],
                sprite: str(raw.sprite),
                spriteFallback: str(raw.spriteFallback),
                source: raw.selectedPokemon ? 'pokeapi' : '',
                ability: raw.ability ? resolveLocalizedSlug('ability', str(raw.ability)) : '',
                abilitiesList: strList(raw.abilitiesList).map(n => resolveLocalizedSlug('ability', n)),
                legalMovesList: [...new Set(strList(raw.legalMovesList).map(n => getChampionsMove(n)?.english).filter(Boolean))],
                item: raw.item ? resolveLocalizedSlug('item', str(raw.item)) : '',
                itemState: ['active', 'knocked', 'consumed'].includes(raw.itemState) ? raw.itemState : 'active',
                notes: str(raw.notes)
            };
            slot.moves = Array.from({ length: 4 }, (_, m) => {
                const r = (raw.moves && raw.moves[m]) || {};
                return normalizePP({
                    name: str(r.name),
                    type: str(r.type) || 'unknown',
                    basePP: Number(r.basePP) || 0,
                    ppCurrent: Number(r.ppCurrent) || 0,
                    ppMax: Number(r.ppMax) || 0
                });
            });
            return slot;
        }

        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Object.hasOwn(UI_TEXT, parsed.userLocale)) userLocale = parsed.userLocale;
                    if (parsed.championsFormat === 'Doubles' || parsed.championsFormat === 'Singles') championsFormat = parsed.championsFormat;
                    if (Array.isArray(parsed.slotsData)) {
                        slotsData = Array.from({ length: NUM_SLOTS }, (_, i) => normalizeSlot(parsed.slotsData[i], i));
                    }
                }
            } catch (e) {
                console.error('Error cargando el estado guardado (se usa estado limpio):', e);
            }
            updateModeUI();
        }

        /* =====================================================================
         *  ÍNDICES GLOBALES (autocompletado + resolución de nombres)
         * ===================================================================== */
        function readIndexCache() {
            try {
                const raw = localStorage.getItem(INDEX_CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' && parsed.data ? parsed : null;
            } catch (e) { return null; }
        }

        function writeIndexCache(data, complete) {
            try {
                localStorage.setItem(INDEX_CACHE_KEY, JSON.stringify({ ts: complete ? Date.now() : 0, data }));
            } catch (e) { /* caché opcional */ }
        }

        function populateDatalist(elementId, items) {
            const listEl = document.getElementById(elementId);
            if (!listEl) return;
            listEl.innerHTML = [...new Set(items)].sort((a,b) => a.localeCompare(b, document.documentElement.lang)).map(item => `<option value="${escapeHtml(item)}"></option>`).join('');
        }

        function applyIndexes(data) {
            activeIndexes = data;
            if (Array.isArray(data.pokemon)) {
                speciesIdMap.clear();
                data.pokemon.forEach(slug => speciesIdMap.set(toShowdownId(slug), slug));
                speciesPrefixList = [...speciesIdMap.keys()].sort((a, b) => b.length - a.length);
                populateDatalist('allPokemonList', data.pokemon.map(formatName));
            }
            rebuildLocalizedLists();
        }

        async function fetchGlobalIndexes() {
            const cached = readIndexCache();
            let data = cached ? { ...cached.data } : {};
            delete data.moves; // discard the old generic PokéAPI move index
            if (cached) applyIndexes(data);
            if (cached && cached.ts && Date.now() - cached.ts < INDEX_TTL_MS) return;

            const endpoints = {
                pokemon: `${POKEAPI}/pokemon-species?limit=100000`,
                abilities: `${POKEAPI}/ability?limit=100000`,
                items: `${POKEAPI}/item?limit=100000`
            };
            const keys = Object.keys(endpoints);
            // allSettled: un fallo no arrastra a los demás índices
            const results = await Promise.allSettled(keys.map(k => fetchJSON(endpoints[k], { timeout: 20000 })));

            const failed = [];
            results.forEach((r, i) => {
                const list = r.status === 'fulfilled' && Array.isArray(r.value?.results)
                    ? r.value.results.map(x => x.name).filter(Boolean)
                    : null;
                if (list && list.length) {
                    data[keys[i]] = list;
                } else {
                    failed.push(keys[i]);
                    console.warn(`Índice "${keys[i]}" no disponible:`, r.status === 'rejected' ? r.reason : 'respuesta vacía');
                }
            });

            applyIndexes(data);
            writeIndexCache(data, failed.length === 0);
            if (failed.length) {
                showToast(t('indexesError', { names: failed.map(k => k === 'pokemon' ? 'Pokémon' : t(k === 'abilities' ? 'ability' : 'item')).join(', ') }), 'warn');
            }
        }

        /* =====================================================================
         *  MODOS / INTERFAZ DE CABECERA
         * ===================================================================== */
        function updateModeUI() {
            document.documentElement.lang = userLocale === 'es-LA' ? 'es-419' : userLocale;
            document.title = 'Battle Tracker — Pokémon Champions & PP Counter';
            document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
            document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
            document.getElementById('languageSelector').value = userLocale;

            for (const fmt of ['Doubles', 'Singles']) {
                const button = document.getElementById(`btnFormat${fmt}`);
                button.className = fmt === championsFormat
                    ? 'px-2 py-1 rounded bg-red-600 text-white text-xs font-bold transition'
                    : 'px-2 py-1 rounded text-slate-400 hover:text-white text-xs font-bold transition';
                button.setAttribute('aria-pressed', String(fmt === championsFormat));
            }
            document.getElementById('modeBadge').textContent = t('mode', { format: t(championsFormat), count: visibleSlotCount() });
        }
        function setChampionsFormat(fmt) {
            if (!['Doubles', 'Singles'].includes(fmt)) return;
            championsFormat = fmt;
            updateModeUI();
            saveState();
            renderSlots();
            slotsData.slice(0, visibleSlotCount()).forEach((slot, i) => {
                if (slot.selectedPokemon && !slot.formsList.length) refreshSlot(i);
            });
        }

        function refreshSlot(slotIndex) {
            const slot = slotsData[slotIndex];
            if (!slot || !slot.selectedPokemon) return Promise.resolve();
            return fetchPokemonDetails(slot.selectedPokemon, slotIndex, {
                resetMoves: false,
                formName: slot.activeFormName || null
            });
        }

        /* =====================================================================
         *  APIs: CHAMPIONS BATTLE DATA + POKÉAPI
         * ===================================================================== */
        async function getSpecies(slug) {
            if (!speciesCache[slug]) speciesCache[slug] = await fetchJSON(`${POKEAPI}/pokemon-species/${slug}`);
            return speciesCache[slug];
        }

        async function getPokemon(name) {
            if (!pokemonCache[name]) pokemonCache[name] = await fetchJSON(`${POKEAPI}/pokemon/${name}`);
            return pokemonCache[name];
        }

        /**
         * Resuelve especie + variedad (forma) en PokéAPI.
         * Pasa SIEMPRE por /pokemon-species: /pokemon/deoxys, /pokemon/aegislash, etc. devuelven 404
         * porque su forma por defecto se llama "deoxys-normal", "aegislash-shield"...
         */
        async function resolvePokemonData(query, formHint) {
            const id = toShowdownId(query);
            let formId = toShowdownId(formHint || '');
            let speciesSlug = speciesIdMap.get(id);

            if (!speciesSlug) {
                // "charizardmegax" -> especie "charizard" por prefijo más largo
                const prefix = speciesPrefixList.find(p => id.startsWith(p));
                if (prefix) {
                    speciesSlug = speciesIdMap.get(prefix);
                    formId = formId || id;
                }
            }

            let species = null;
            if (speciesSlug) {
                species = await getSpecies(speciesSlug);
            } else {
                // Índice aún no cargado: intentamos por slug directo y, si falla, vía /pokemon
                const slug = slugify(query);
                try {
                    species = await getSpecies(slug);
                } catch (e) {
                    const p = await getPokemon(slug);
                    species = await getSpecies(p.species.name);
                    formId = formId || toShowdownId(p.name);
                }
            }

            const varieties = species.varieties || [];
            let chosen = formId ? varieties.find(v => toShowdownId(v.pokemon.name) === formId) : null;
            if (formId && !chosen) throw Object.assign(new Error(t('unknownForm')), { userKey: 'unknownForm' });
            chosen = chosen || varieties.find(v => v.is_default) || varieties[0];
            if (!chosen) throw Object.assign(new Error(t('noVarieties')), { userKey: 'noVarieties' });

            const pokemonData = await getPokemon(chosen.pokemon.name);
            const forms = varieties.map(v => ({
                name: v.pokemon.name,
                label: formatFormLabel(v.pokemon.name, species.name),
                is_default: v.is_default
            }));
            return { species, pokemonData, forms };
        }

        async function fetchPokemonDetails(query, slotIndex, { resetMoves = true, formName = null } = {}) {
            const cleanQuery = String(query || '').trim();
            if (!toShowdownId(cleanQuery)) return;

            const token = ++requestTokens[slotIndex];
            beginLoading(t('loadingPokemon', { name: cleanQuery }));

            try {
                const poke = await resolvePokemonData(cleanQuery, formName);
                if (token !== requestTokens[slotIndex]) return;

                applyPokemonData(slotIndex, { poke, resetMoves, formName });
            } catch (err) {
                console.warn(`Error al obtener información de ${cleanQuery}:`, err);
                if (token === requestTokens[slotIndex]) {
                    showToast(t('pokemonError', { name: cleanQuery, reason: describeError(err) }));
                    scheduleRender(slotIndex); // revierte el texto escrito en el input
                }
            } finally {
                endLoading();
            }
        }

        function applyPokemonData(slotIndex, { poke, resetMoves, formName }) {
            const slot = slotsData[slotIndex];
            if (!slot) return;

            const pokeSprite = poke
                ? (poke.pokemonData.sprites?.other?.['official-artwork']?.front_default
                    || poke.pokemonData.sprites?.front_default || '')
                : '';

            slot.source = 'pokeapi';
            slot.selectedPokemon = formatName(poke.species.name);
            slot.activeFormName = poke.pokemonData.name;
            slot.formsList = poke ? poke.forms : [];

            const pokeTypes = poke ? poke.pokemonData.types.map(t => t.type.name) : [];
            slot.types = pokeTypes.length ? pokeTypes : ['unknown'];

            slot.spriteFallback = pokeSprite || FALLBACK_SPRITE;
            slot.sprite = pokeSprite || FALLBACK_SPRITE;
            slot.abilitiesList = poke.pokemonData.abilities.map(a => a.ability.name);
            const abilityStillValid = slot.abilitiesList.includes(slot.ability);
            if (resetMoves || !slot.ability || (formName && slot.abilitiesList.length && !abilityStillValid)) {
                slot.ability = slot.abilitiesList[0] || '';
            }

            // PokéAPI agrega learnsets de varios juegos: sugerencias, no validación de Champions.
            slot.legalMovesList = [...new Set(poke.pokemonData.moves.map(m => getChampionsMove(m.move.name)?.english).filter(Boolean))].sort();
            if (resetMoves) slot.item = '';
            if (resetMoves) slot.itemState = 'active';

            if (resetMoves) {
                slot.moves = [emptyMove(), emptyMove(), emptyMove(), emptyMove()];
            }

            saveState();
            scheduleRender(slotIndex);
            Promise.allSettled([
                ...slot.abilitiesList.map(name => hydrateNames('ability', name)),
                ...slot.types.map(name => hydrateNames('type', name))
            ]).then(() => { rebuildLocalizedLists(); scheduleRender(slotIndex); }).catch(() => {});

            slot.moves.forEach((m, i) => { if (m.name && !m.basePP) fetchMoveDetails(m.name, slotIndex, i); });
        }

        /* ---- Movimientos ---- */
        // PP and types always come from the bundled Champions table.
        // The async signature is retained for existing event handlers.
        async function fetchMoveDetails(moveName, slotIndex, moveIndex) {
            const move = slotsData[slotIndex]?.moves?.[moveIndex];
            if (!move || toShowdownId(move.name) !== toShowdownId(moveName)) return false;
            const entry = getChampionsMove(moveName);
            if (!entry) {
                move.basePP = move.ppCurrent = move.ppMax = 0;
                move.type = 'unknown';
                saveState();
                scheduleRender(slotIndex);
                showToast(t('moveUnavailable', { name: moveName }), 'warn');
                return false;
            }
            const tracked = move.ppMax > 0;
            move.name = entry.english;
            void hydrateNames('move', entry.id); // official localized metadata; fixed PP remain from Champions
            move.type = entry.type;
            move.basePP = move.ppMax = entry.pp;
            move.ppCurrent = tracked ? Math.min(entry.pp, finitePP(move.ppCurrent)) : entry.pp;
            saveState();
            scheduleRender(slotIndex);
            return true;
        }

        /* =====================================================================
         *  HANDLERS DE ESTADO
         * ===================================================================== */
        function handlePokemonChange(slotIndex, val) {
            const clean = String(val || '').trim();
            if (!clean) { clearSlot(slotIndex); return; }
            fetchPokemonDetails(clean, slotIndex, { resetMoves: true });
        }

        function handleFormChange(slotIndex, formName) {
            const slot = slotsData[slotIndex];
            if (!slot || !slot.selectedPokemon) return;
            fetchPokemonDetails(slot.selectedPokemon, slotIndex, { resetMoves: false, formName });
        }

        function handleAbilityChange(slotIndex, val) {
            slotsData[slotIndex].ability = val ? resolveLocalizedSlug('ability', val) : '';
            if (val) hydrateNames('ability', slotsData[slotIndex].ability).then(() => scheduleRender(slotIndex));
            saveState();
        }

        function handleItemChange(slotIndex, val) {
            slotsData[slotIndex].item = val ? resolveLocalizedSlug('item', val) : '';
            if (val) hydrateNames('item', slotsData[slotIndex].item).then(() => { rebuildLocalizedLists(); scheduleRender(slotIndex); });
            saveState();
        }

        function handleMoveChange(slotIndex, moveIndex, val) {
            const slot = slotsData[slotIndex];
            const clean = String(val || '').trim();

            if (!clean) {
                slot.moves[moveIndex] = emptyMove();
                saveState();
                scheduleRender(slotIndex);
                return;
            }
            const chosen = getChampionsMove(clean);
            const previous = getChampionsMove(slot.moves[moveIndex].name);
            if (chosen && previous?.id === chosen.id) {
                normalizePP(slot.moves[moveIndex]);
                saveState();
                scheduleRender(slotIndex);
                return;
            }
            // Reinicia PP/tipo del movimiento anterior para no arrastrar datos de otro ataque si la búsqueda falla
            slot.moves[moveIndex] = { ...emptyMove(), name: clean };
            saveState();
            scheduleRender(slotIndex);
            fetchMoveDetails(clean, slotIndex, moveIndex);
        }

        function adjustPP(slotIndex, moveIndex, delta) {
            const move = slotsData[slotIndex]?.moves?.[moveIndex];
            if (!move || !move.ppMax) return;
            if (!Number.isInteger(delta)) return;
            normalizePP(move);
            move.ppCurrent = Math.max(0, Math.min(move.ppMax, move.ppCurrent + delta));
            saveState();
            updateMovePPDom(slotIndex, moveIndex); // actualización puntual: sin re-render de toda la tarjeta
        }

        function handleNotesChange(slotIndex, val) {
            slotsData[slotIndex].notes = String(val ?? '');
            saveState();
        }

        function toggleItemState(slotIndex) {
            const slot = slotsData[slotIndex];
            if (!slot) return;
            const states = ['active', 'knocked', 'consumed'];
            const idx = states.indexOf(slot.itemState || 'active');
            slot.itemState = states[(idx + 1) % states.length];
            saveState();
            scheduleRender(slotIndex);
        }

        function clearSlot(slotIndex, { silent = false } = {}) {
            requestTokens[slotIndex]++; // invalida peticiones en vuelo para este slot
            slotsData[slotIndex] = emptySlot(slotIndex);
            if (!silent) {
                saveState();
                scheduleRender(slotIndex);
            }
        }

        function resetAllSlots() {
            if (!confirm(t('resetConfirm', { count: visibleSlotCount() }))) return;
            for (let i = 0; i < visibleSlotCount(); i++) clearSlot(i, { silent: true });
            saveState();
            scheduleRender();
        }

        function handleSpriteError(slotIndex, img) {
            const slot = slotsData[slotIndex];
            img.onerror = () => { img.style.display = 'none'; };
            if (slot && img.isConnected && slot.spriteFallback && img.src !== slot.spriteFallback) {
                slot.sprite = slot.spriteFallback;
                saveState();
                img.src = slot.spriteFallback;
            } else {
                img.style.display = 'none';
            }
        }

        /* =====================================================================
         *  RENDERIZADO
         * ===================================================================== */
        function getItemStatusBadgeClass(state) {
            if (state === 'knocked') return 'bg-red-950/80 text-red-400 border border-red-800/80 hover:bg-red-900/80';
            if (state === 'consumed') return 'bg-amber-950/80 text-amber-400 border border-amber-800/80 hover:bg-amber-900/80';
            return 'bg-emerald-950/50 text-emerald-400 border border-emerald-800/50 hover:bg-emerald-900/50';
        }

        function getItemStatusIconHtml(state) {
            if (state === 'knocked') return `<i class="fa-solid fa-hand-sparkles"></i> ${escapeHtml(t('knocked'))}`;
            if (state === 'consumed') return `<i class="fa-solid fa-cookie-bite"></i> ${escapeHtml(t('consumed'))}`;
            return `<i class="fa-solid fa-shield-halved"></i> ${escapeHtml(t('active'))}`;
        }

        function getPPColorClass(current, max) {
            if (!max) return 'bg-slate-700';
            const ratio = current / max;
            if (ratio > 0.5) return 'bg-emerald-500';
            if (ratio > 0.2) return 'bg-amber-500';
            return 'bg-red-500';
        }

        function ppTextHtml(move) {
            if (!move.ppMax) return '<span class="text-slate-500">—</span>';
            return `<span class="${move.ppCurrent === 0 ? 'text-red-500 font-extrabold' : ''}">${move.ppCurrent}</span>/${move.ppMax}`;
        }

        function updateMovePPDom(slotIndex, moveIndex) {
            const move = slotsData[slotIndex]?.moves?.[moveIndex];
            const bar = document.getElementById(`ppbar_${slotIndex}_${moveIndex}`);
            const txt = document.getElementById(`pptext_${slotIndex}_${moveIndex}`);
            if (!move || !bar || !txt) { scheduleRender(slotIndex); return; }
            bar.style.width = `${move.ppMax > 0 ? (move.ppCurrent / move.ppMax) * 100 : 0}%`;
            bar.className = `h-full transition-all duration-300 ${getPPColorClass(move.ppCurrent, move.ppMax)}`;
            txt.innerHTML = ppTextHtml(move);
        }

        function moveHtml(slot, sIdx, move, mIdx, listId) {
            const pct = move.ppMax > 0 ? (move.ppCurrent / move.ppMax) * 100 : 0;
            return `
                <div class="bg-slate-950 border border-slate-800/80 rounded-lg p-2.5 flex flex-col gap-2">
                    <div class="flex items-center gap-2">
                        <span class="type-${safeCssToken(move.type)} text-[9px] font-bold px-1.5 py-0.5 rounded uppercase w-20 break-words text-center">
                            ${escapeHtml(localizedName('type', move.type))}
                        </span>
                        <input
                            type="text"
                            data-tooltip-kind="move" data-fid="move_${mIdx}"
                            value="${escapeHtml(moveDisplayName(move.name))}"
                            placeholder="${escapeHtml(t('move', { n: mIdx + 1 }))}"
                            list="${listId}"
                            onchange="handleMoveChange(${sIdx}, ${mIdx}, this.value)"
                            class="flex-1 min-w-0 bg-slate-900 border border-slate-700/60 focus:border-red-500 text-xs text-white px-2 py-1 rounded outline-none font-medium"
                        />

                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex-1 bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
                            <div id="ppbar_${sIdx}_${mIdx}"
                                class="h-full transition-all duration-300 ${getPPColorClass(move.ppCurrent, move.ppMax)}"
                                style="width: ${pct}%"></div>
                        </div>
                        <div id="pptext_${sIdx}_${mIdx}" class="text-xs font-mono font-bold w-12 text-center text-slate-300">${ppTextHtml(move)}</div>
                        <div class="flex items-center gap-1">
                            <button title="${escapeHtml(t('decrease'))}" aria-label="${escapeHtml(t('decrease'))}" onclick="adjustPP(${sIdx}, ${mIdx}, -1)"
                                class="bg-slate-800 hover:bg-red-900/50 hover:text-red-400 text-slate-300 border border-slate-700 w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition active:scale-95">-1</button>
                            <button title="${escapeHtml(t('increase'))}" aria-label="${escapeHtml(t('increase'))}" onclick="adjustPP(${sIdx}, ${mIdx}, 1)"
                                class="bg-slate-800 hover:bg-emerald-900/50 hover:text-emerald-400 text-slate-300 border border-slate-700 w-6 h-6 rounded flex items-center justify-center text-xs font-bold transition active:scale-95">+1</button>
                        </div>
                    </div>
                </div>`;
        }

        function slotHtml(slot, sIdx) {
            const hasForms = slot.formsList.length > 1;
            const formsOptionsHtml = hasForms
                ? slot.formsList.map(f => `<option value="${escapeHtml(f.name)}" ${toShowdownId(f.name) === toShowdownId(slot.activeFormName) ? 'selected' : ''}>${escapeHtml(formatFormLabel(f.name, slugify(slot.selectedPokemon)))}</option>`).join('')
                : '';

            const typesHtml = slot.types.map(t =>
                `<span class="type-${safeCssToken(t)} text-[10px] font-extrabold px-2 py-0.5 rounded uppercase shadow-sm">${escapeHtml(localizedName('type', t))}</span>`
            ).join('');

            // UN datalist por slot compartido por sus 4 movimientos (antes: 4 por slot => hasta 24 listas gigantes)
            const isLegalMode = slot.legalMovesList.length > 0;
            const movesDatalistHtml = isLegalMode
                ? `<datalist id="movesList_${sIdx}">${slot.legalMovesList.map(lm => `<option value="${escapeHtml(moveDisplayName(lm))}">`).join('')}</datalist>`
                : '';
            const listId = isLegalMode ? `movesList_${sIdx}` : 'allMovesList';
            const movesHtml = slot.moves.map((move, mIdx) => moveHtml(slot, sIdx, move, mIdx, listId)).join('');

            const useAbilitySelect = slot.abilitiesList.length > 0;
            const abilityOptions = (slot.ability && !slot.abilitiesList.includes(slot.ability))
                ? [slot.ability, ...slot.abilitiesList]
                : slot.abilitiesList;


            const itemDimmed = slot.itemState !== 'active' ? 'line-through opacity-60 text-red-400' : '';

            return `
            <div id="slot_${sIdx}" class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex flex-col justify-between shadow-xl transition">
                <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                            Pokémon ${slot.id}
                        </span>
                        <button onclick="clearSlot(${sIdx})" title="${escapeHtml(t('clear'))}" class="text-xs text-slate-500 hover:text-red-400 transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-3 mb-3">
                        <div class="relative flex-1">
                            <input
                                type="text"
                                data-fid="pokemon"
                                value="${escapeHtml(slot.selectedPokemon)}"
                                placeholder="${escapeHtml(t('search'))}"
                                list="allPokemonList"
                                onchange="handlePokemonChange(${sIdx}, this.value)"
                                class="w-full bg-slate-950 border border-slate-700 focus:border-red-500 text-white rounded-lg px-3 py-2 text-sm font-bold placeholder-slate-500 outline-none transition"
                            />
                        </div>
                        <div class="w-12 h-12 bg-slate-950 border border-slate-800 rounded-lg flex items-center justify-center p-1 flex-shrink-0">
                            ${slot.sprite
                                ? `<img src="${escapeHtml(slot.sprite)}" alt="${escapeHtml(slot.selectedPokemon)}" onerror="handleSpriteError(${sIdx}, this)" class="w-full h-full object-contain filter drop-shadow">`
                                : `<i class="fa-solid fa-dragon text-slate-700 text-xl"></i>`}
                        </div>
                    </div>

                    <div class="flex items-center justify-between flex-wrap gap-2 mb-4 bg-slate-950/60 p-2 rounded-lg border border-slate-800/80">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-[10px] uppercase font-bold text-slate-400 mr-1">${escapeHtml(t('types'))}</span>
                            ${typesHtml}
                        </div>
                        <div class="flex items-center gap-1">
                            ${hasForms ? `
                                <select
                                    data-fid="form"
                                    onchange="handleFormChange(${sIdx}, this.value)"
                                    class="bg-red-950/40 border border-red-800/60 text-red-300 text-xs font-semibold rounded px-2 py-1 outline-none focus:ring-1 focus:ring-red-500 cursor-pointer"
                                    title="${escapeHtml(t('formTitle'))}">
                                    ${formsOptionsHtml}
                                </select>
                            ` : `<span class="text-[10px] text-slate-600 italic">${escapeHtml(t('noForms'))}</span>`}
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div>
                            <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">${escapeHtml(t('ability'))}</label>
                            ${useAbilitySelect ? `
                                <select
                                    data-tooltip-kind="ability" data-fid="ability"
                                    onchange="handleAbilityChange(${sIdx}, this.value)"
                                    class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 text-slate-200 text-xs rounded-lg p-2 outline-none">
                                    ${abilityOptions.map(ab => `<option value="${escapeHtml(ab)}" ${ab === slot.ability ? 'selected' : ''}>${escapeHtml(localizedName('ability', ab))}</option>`).join('')}
                                </select>
                            ` : `
                                <input
                                    type="text"
                                    data-tooltip-kind="ability" data-fid="ability" data-keep="1"
                                    value="${escapeHtml(localizedName('ability', slot.ability))}"
                                    placeholder="${escapeHtml(t('abilityPlaceholder'))}"
                                    list="allAbilitiesList"
                                    onchange="handleAbilityChange(${sIdx}, this.value)"
                                    class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 text-slate-200 text-xs rounded-lg p-2 outline-none"
                                />
                            `}
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <label class="text-[10px] uppercase font-bold text-slate-400">${escapeHtml(t('item'))}</label>
                                <button
                                    onclick="toggleItemState(${sIdx})"
                                    title="${escapeHtml(t('itemTitle'))}"
                                    class="text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1 transition ${getItemStatusBadgeClass(slot.itemState)}">
                                    ${getItemStatusIconHtml(slot.itemState)}
                                </button>
                            </div>
                            <input
                                type="text"
                                data-tooltip-kind="item" data-fid="item" data-keep="1"
                                value="${escapeHtml(localizedName('item', slot.item))}"
                                placeholder="${escapeHtml(t('itemPlaceholder'))}"
                                list="allItemsList"
                                onchange="handleItemChange(${sIdx}, this.value)"
                                class="w-full bg-slate-950 border border-slate-800 focus:border-red-500 text-slate-200 text-xs rounded-lg p-2 outline-none transition ${itemDimmed}"
                            />
                        </div>
                    </div>

                    <div class="space-y-2 mb-4">
                        <span class="block text-[10px] uppercase font-bold text-slate-400 tracking-wider">${escapeHtml(t('moves'))}</span>
                        ${movesHtml}
                        ${movesDatalistHtml}
                    </div>
                </div>

                <div>
                    <input
                        type="text"
                        data-fid="notes" data-keep="1"
                        value="${escapeHtml(slot.notes)}"
                        placeholder="${escapeHtml(t('notes'))}"
                        onchange="handleNotesChange(${sIdx}, this.value)"
                        class="w-full bg-slate-950 border border-slate-800 focus:border-slate-600 text-slate-300 text-xs rounded-lg px-3 py-1.5 outline-none"
                    />
                </div>
            </div>`;
        }

        function captureFocus(root) {
            const a = document.activeElement;
            if (a && root.contains(a) && a.dataset && a.dataset.fid) {
                return { slotId: a.closest('[id^=slot_]')?.id, fid: a.dataset.fid, start: a.selectionStart, end: a.selectionEnd, value: a.value, dirty: a.matches('input, textarea') && a.value !== a.defaultValue };
            }
            return null;
        }

        function restoreFocus(root, snap) {
            if (!snap) return;
            const card = root.id === snap.slotId ? root : root.querySelector(`#${snap.slotId}`);
            const el = card?.querySelector(`[data-fid="${snap.fid}"]`);
            if (!el) return;
            if (snap.dirty) el.value = snap.value; // conserva únicamente borradores no confirmados
            el.focus();
            try { el.setSelectionRange(snap.start, snap.end); } catch (e) { /* no aplica */ }
        }

        function renderSlot(slotIndex) {
            if (tooltipTarget?.closest(`#slot_${slotIndex}`)) hideInfoTooltip();
            const el = document.getElementById(`slot_${slotIndex}`);
            if (slotIndex >= visibleSlotCount()) return;
            if (!el) { renderSlots(); return; }
            const tpl = document.createElement('template');
            tpl.innerHTML = slotHtml(slotsData[slotIndex], slotIndex).trim();
            const fresh = tpl.content.firstElementChild;
            const snap = captureFocus(el);
            el.replaceWith(fresh);
            restoreFocus(fresh, snap);
        }

        function renderSlots() {
            hideInfoTooltip();
            const container = document.getElementById('slotsContainer');
            if (!container) return;
            const snap = captureFocus(container);
            container.className = `lg:col-span-12 grid grid-cols-1 md:grid-cols-2 ${championsFormat === 'Singles' ? 'xl:grid-cols-3' : 'xl:grid-cols-2'} gap-6`;
            container.innerHTML = slotsData.slice(0, visibleSlotCount()).map((slot, i) => slotHtml(slot, i)).join('');
            restoreFocus(container, snap);
        }

        // Render por lotes: varias respuestas asíncronas en el mismo frame => un solo repintado
        let renderQueued = false;
        let dirtyAll = false;
        const dirtySlots = new Set();

        function scheduleRender(slotIndex = null) {
            if (slotIndex === null) dirtyAll = true;
            else dirtySlots.add(slotIndex);
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(flushRender);
        }

        function flushRender() {
            renderQueued = false;
            if (dirtyAll) {
                dirtyAll = false;
                dirtySlots.clear();
                renderSlots();
                return;
            }
            const idxs = [...dirtySlots];
            dirtySlots.clear();
            idxs.forEach(renderSlot);
        }

        /* =====================================================================
         *  ARRANQUE
         * ===================================================================== */
        document.addEventListener('DOMContentLoaded', async () => {
            loadSavedState();
            rebuildLocalizedLists();
            saveState(); // migrate the old PokéAPI PP values even while offline
            renderSlots();
            try {
                await fetchGlobalIndexes();
            } catch (e) {
                console.warn('Error inesperado cargando índices:', e);
            }
            // Solo completa slots guardados que nunca tuvieron datos de formas (versiones antiguas del estado).
            // Ya NO se vuelve a consultar todo en cada carga: el estado guardado es suficiente.
            slotsData.slice(0, visibleSlotCount()).forEach((slot, i) => {
                if (slot.selectedPokemon && slot.formsList.length === 0) refreshSlot(i);
                slot.moves.forEach((move, m) => { if (move.name && !move.basePP) fetchMoveDetails(move.name, i, m); });
            });
        });
    </script>
</body>
</html>
